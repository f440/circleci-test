version: 2.1

orbs:
  changed-files: https://raw.githubusercontent.com/f440/change-files-orb/refs/heads/main/orb.yml

jobs:
  verify-src-gating:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Clear marker
          command: |
            rm -f /tmp/changed-files-check-ran
      - when:
          condition:
            not:
              equal: [ codex/test-changed-files-continue, << pipeline.git.branch >> ]
          steps:
            - changed-files/check:
                base-branch: main
                files: |
                  src/**
                debug: true
            - run:
                name: Mark changed-files/check execution
                command: touch /tmp/changed-files-check-ran
      - run:
          name: Assert changed-files/check was skipped
          command: |
            if [ -e /tmp/changed-files-check-ran ]; then
              echo "changed-files/check unexpectedly ran"
              exit 1
            fi
            echo "changed-files/check was skipped by branch condition"

workflows:
  verify:
    jobs:
      - verify-src-gating

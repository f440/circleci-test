version: 2.1

orbs:
  changed-files: https://raw.githubusercontent.com/f440/change-files-orb/refs/heads/main/orb.yml

jobs:
  verify-src-gating:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - changed-files/check:
          base-branch: main
          files: |
            src/**
            !src/fff.txt
          debug: true
      - run:
          name: Fail if the negated pattern did not exclude the file
          command: |
            echo "changed-files/check continued even though src/fff.txt was excluded"
            exit 1

workflows:
  verify:
    jobs:
      - verify-src-gating
